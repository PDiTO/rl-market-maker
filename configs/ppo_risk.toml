# Risk-averse reward: the base PPO agent earns the most but carries large inventory
# and has the widest spread of session PnL. This run raises the running inventory
# penalty tenfold and removes half of any gain made from price moves on inventory
# (asymmetric dampening), everything else unchanged. 10M steps per seed, since the
# base run's validation PnL had flattened by then.
# Run: rlmm train --config configs/ppo_risk.toml

[env]
step_ms = 100.0          # one decision every 100 ms
horizon_s = 60.0         # 600 decisions per episode
warmup_s = 5.0
quote_size = 5
max_position = 50

[env.market]             # lob's [market] table; defaults match lob's configs
volatility = 2.0
informed = 0.5

[env.sim]                # lob's [sim] table
order_latency_ns = 50_000
market_data_latency_ns = 50_000
maker_fee = -0.1
taker_fee = 0.3

[env.reward]
inventory_penalty = 0.05    # ten times the base run
dampening = 0.5
terminal_liquidation = true

[ppo]
total_timesteps = 10_000_000
num_envs = 16
num_steps = 512
learning_rate = 3e-4
anneal_lr = true
gamma = 0.99
gae_lambda = 0.95
num_minibatches = 8
update_epochs = 5
clip_coef = 0.2
ent_coef = 0.005
vf_coef = 0.5
max_grad_norm = 0.5
hidden_sizes = [128, 128]
eval_every = 5

[train]
seeds = [1, 2, 3]
out_dir = "runs/ppo_risk"
val_episodes = 16
checkpoint_every = 100
