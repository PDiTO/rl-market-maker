# Ablation: the same PPO setup with the directional market-data features hidden
# (book imbalance, microprice, recent returns, trade-flow imbalance). The agent still
# sees its inventory, the clock, the spread, volatility, its queue position and its
# own fills. If the full agent's edge comes from short-term price prediction, this
# one should fall back toward the inventory-skew baselines.
# Run: rlmm train --config configs/ppo_ablation.toml

[env]
step_ms = 100.0
horizon_s = 60.0
warmup_s = 5.0
quote_size = 5
max_position = 50
hide_features = [
    "imbalance_l1",
    "imbalance_l5",
    "micro_minus_mid",
    "ret_1",
    "ret_10",
    "ret_50",
    "trade_imbalance",
]

[env.market]
volatility = 2.0
informed = 0.5

[env.sim]
order_latency_ns = 50_000
market_data_latency_ns = 50_000
maker_fee = -0.1
taker_fee = 0.3

[env.reward]
inventory_penalty = 0.005
dampening = 0.0
terminal_liquidation = true

[ppo]
total_timesteps = 20_000_000
num_envs = 16
num_steps = 512
learning_rate = 3e-4
anneal_lr = true
gamma = 0.99
gae_lambda = 0.95
num_minibatches = 8
update_epochs = 5
clip_coef = 0.2
ent_coef = 0.005
vf_coef = 0.5
max_grad_norm = 0.5
hidden_sizes = [128, 128]
eval_every = 5

[train]
seeds = [1, 2, 3]
out_dir = "runs/ppo_ablation"
val_episodes = 16
checkpoint_every = 100
